name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run type and svelte checks
      run: npm run check
      
    - name: Run unit tests
      run: npm run test:run
      
    - name: Build project
      run: npm run build
