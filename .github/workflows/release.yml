name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create release zip
        run: |
          ZIP_NAME="logseq-doc-agent-${{ github.ref_name }}.zip"
          zip -r "$ZIP_NAME" dist README.md docs package.json icon.png
          [ -f LICENSE ] && zip -r "$ZIP_NAME" LICENSE || true
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
