name: Version Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Version PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This command will only run if there are no changesets
          # But for this project, we just want to version and tag.
          # changesets/action handles versioning automatically.
          version: npx changeset version
          # We don't want to publish to npm, but we want the tag.
          # The action will create the tag if the version changes.
          publish: npx changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
