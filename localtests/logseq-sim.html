<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logseq Simulation</title>
    <link rel="stylesheet" href="logseq-sim.css">
</head>

<body>

    <div id="app">Loading...</div>

    <!-- Sample Content -->
    <!-- App Logic -->
    <script type="module">
        import { mountApp } from './logseq-sim-lib.js';
        import './logseq-mock-api.js'; // Initialize API

        // Initialize the app with the default content
        fetch('./default-content.txt')
            .then(res => res.text())
            .then(defaultContent => {
                mountApp('app', defaultContent.trim());
            })
            .catch(e => {
                console.error('[Sim] Failed to load default content:', e);
                mountApp('app', '* Error loading content');
            });

        // Load the plugin code dynamically to catch errors and ensure ordering
        import('../dist/main.js')
            .then(() => console.log('[Sim] Plugin script loaded successfully'))
            .catch(e => console.error('[Sim] Failed to load plugin script:', e));
    </script>

</body>

</html>
