<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logseq Simulation</title>
    <style>
        :root {
            --ls-primary-text-color: #37352f;
            --ls-secondary-text-color: #585858;
            --ls-bg-color: #ffffff;
            --ls-menu-hover-color: #efefef;
            --ls-border-color: #d3d3d3;
            --ls-link-text-color: #106ba3;
            --ls-block-bullet-color: #c0c0c0;
            --ls-block-bullet-active-color: #4c4c4c;
            --ls-guideline-color: #ddd;
            --ls-page-title-size: 36px;
            --ls-font-family: 'Inter', system-ui, -apple-system, sans-serif;

            --ls-block-properties-bg: #f7f7f7;
            --ls-block-properties-text: #666;
        }

        [data-theme="dark"] {
            --ls-primary-text-color: #e2e2e2;
            --ls-secondary-text-color: #a4a4a4;
            --ls-bg-color: #1a1a1a;
            --ls-menu-hover-color: #2a2a2a;
            --ls-border-color: #444;
            --ls-link-text-color: #7ad1ff;
            --ls-block-bullet-color: #4a4a4a;
            --ls-block-bullet-active-color: #a0a0a0;
            --ls-guideline-color: #333;
            --ls-block-properties-bg: #262626;
            --ls-block-properties-text: #a0a0a0;
        }

        body {
            background-color: var(--ls-bg-color);
            color: var(--ls-primary-text-color);
            font-family: var(--ls-font-family);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        /* Theme Switcher */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 4px;
            background: var(--ls-menu-hover-color);
            border: 1px solid var(--ls-border-color);
            color: var(--ls-primary-text-color);
            cursor: pointer;
            z-index: 1000;
        }

        /* Logseq Classes */
        .ls-block {
            position: relative;
            padding-left: 0;
            margin-top: 4px;
        }

        /* Nesting lines and indentation */
        .block-children-container {
            margin-left: 24px;
            border-left: 1px solid var(--ls-guideline-color);
            padding-left: 10px;
        }

        .ls-block:hover>.block-children-container {
            border-left-color: var(--ls-block-bullet-active-color);
        }

        /* Main Container Layout */
        .block-main-container {
            display: flex;
            align-items: flex-start;
        }

        /* Controls (Bullet) */
        .block-control-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-right: 6px;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .block-control-wrap .bullet {
            width: 6px;
            height: 6px;
            background-color: var(--ls-block-bullet-color);
            border-radius: 50%;
            transition: transform 0.2s, background-color 0.2s;
        }

        .block-control-wrap:hover .bullet {
            background-color: var(--ls-block-bullet-active-color);
            transform: scale(1.2);
        }

        /* Content */
        .block-content-wrapper {
            flex: 1;
            min-width: 0;
            /* Text overflow fix */
        }

        .block-content-inner {
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* Links mimic */
        .page-ref {
            color: var(--ls-link-text-color);
            cursor: pointer;
            text-decoration: none;
        }

        .page-ref:hover {
            text-decoration: underline;
        }

        /* Properties */
        .block-properties {
            background-color: var(--ls-block-properties-bg);
            border-radius: 4px;
            padding: 8px 12px;
            margin-top: 4px;
            margin-bottom: 4px;
            margin-right: 20px;
            /* Bit of breathing room */
            font-size: 0.85em;
            color: var(--ls-block-properties-text);
            display: table;
        }

        .block-properties-row {
            display: table-row;
        }

        .block-properties-name {
            display: table-cell;
            font-weight: 500;
            padding-right: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .block-properties-value {
            display: table-cell;
            font-family: monospace;
        }

        /* Collapse toggle placeholder (visual only for now/simple) */
        .block-control-wrap .expander {
            position: absolute;
            left: -12px;
            color: var(--ls-secondary-text-color);
            font-size: 10px;
            display: none;
        }

        .ls-block:hover>.block-main-container .expander {
            display: block;
        }

        .is-collapsed .block-children-container {
            display: none;
        }

        .is-collapsed .bullet {
            background-color: var(--ls-link-text-color) !important;
            opacity: 0.5;
            box-shadow: 0 0 0 2px var(--ls-link-text-color);
        }

        /* Editor Area for Testing */
        #editor-toggle {
            margin-bottom: 20px;
            font-size: 0.9em;
            color: var(--ls-link-text-color);
            cursor: pointer;
            display: inline-block;
        }

        textarea#source-input {
            width: 100%;
            height: 150px;
            background: var(--ls-menu-hover-color);
            color: var(--ls-primary-text-color);
            border: 1px solid var(--ls-border-color);
            padding: 10px;
            font-family: monospace;
            display: none;
        }
    </style>
</head>

<body>

    <div id="app">Loading...</div>

    <!-- Sample Content -->
    <script type="text/plain" id="default-content">
* Embracing Imperfection
  property:: true
  ls-type:: guide
  * Our society glorifies perfection and achievement, but the truth is that **imperfection is an inevitable** part of the human experience. Instead of constantly striving for perfection, it's important to learn to embrace our imperfections.
  * Accepting imperfection:
    status:: active
    * Imperfection is a natural part of the human experience.
    * [[Perfectionism]] can be harmful and prevent us from taking action.
      reason:: fear of failure
    * Accepting imperfection can lead to greater [[self-acceptance]] and resilience.
  * How to embrace imperfection:
    * Practice [[self-compassion]] and treat yourself with kindness.
    * Focus on progress, not perfection.
    * Be open to making mistakes and learning from them.
    * Embrace your unique qualities and embrace your flaws.
  * Embracing imperfection is a liberating and empowering mindset that can help us live a more authentic and fulfilling life.
</script>

    <!-- Import Maps/ESM -->
    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.19.3';
        import { signal, computed, effect } from 'https://esm.sh/@preact/signals@1.2.2';
        import { html } from 'https://esm.sh/htm@3.1.1/preact';

        // --- State Management ---
        const theme = signal('dark');
        const sourceText = signal(document.getElementById('default-content').textContent.trim());
        const showEditor = signal(false);

        effect(() => {
            document.documentElement.setAttribute('data-theme', theme.value);
        });

        const toggleTheme = () => {
            theme.value = theme.value === 'dark' ? 'light' : 'dark';
        };

        // --- Parser Logic ---

        function parseProperties(lines) {
            const props = {};
            const rest = [];
            const propRegex = /^\s*([^:]+)::\s*(.+)$/;

            let parsingProps = true;
            for (const line of lines) {
                if (parsingProps) {
                    const match = line.match(propRegex);
                    if (match) {
                        props[match[1].trim()] = match[2].trim();
                    } else {
                        parsingProps = false;
                        rest.push(line);
                    }
                } else {
                    rest.push(line);
                }
            }
            return { props, rest };
        }

        function parseOrg(text) {
            const lines = text.split('\n');
            const roots = [];
            const stack = []; // { indent, node }

            lines.forEach((line) => {
                if (!line.trim()) return;

                // Combined regex for:
                // 1. Standard Org headers: * Header, ** Header (at start of line)
                // 2. Indented bullets:   * Item,   - Item
                const match = line.match(/^(\s*)(\*+|-)\s+(.*)/);

                let level = 0;
                let content = "";
                let isBlock = false;

                if (match) {
                    const indentStr = match[1];
                    const bullet = match[2];
                    const text = match[3];

                    if (bullet === '-') {
                        // Dash is always indentation based
                        level = Math.floor(indentStr.length / 2);
                    } else {
                        // Star(s)
                        if (indentStr.length === 0) {
                            // No indent -> Standard Org Header (* is level 0, ** is level 1)
                            level = bullet.length - 1;
                        } else {
                            // Indented -> Treat as listed item
                            level = Math.floor(indentStr.length / 2);
                        }
                    }
                    content = text;
                    isBlock = true;
                }

                if (isBlock) {
                    const node = {
                        id: Math.random().toString(36).substr(2, 9),
                        content: content,
                        rawLines: [], // for properties
                        children: [],
                        properties: {},
                        level: level,
                        collapsed: signal(false)
                    };

                    // Find parent
                    // If level is 0, stack should be empty or we pop until empty?
                    // Actually, if we have level 0, we pop everything.
                    // If level > stack.level, we push.
                    // If level <= stack.level, we pop until we find a parent with level < current level.

                    while (stack.length > 0 && stack[stack.length - 1].level >= level) {
                        stack.pop();
                    }

                    if (stack.length === 0) {
                        roots.push(node);
                    } else {
                        // Parent is now at top of stack
                        stack[stack.length - 1].node.children.push(node);
                    }
                    stack.push({ level, node });

                } else {
                    // Continuation line or property
                    if (stack.length > 0) {
                        const lastNode = stack[stack.length - 1].node;
                        lastNode.rawLines.push(line);
                    } else {
                        // Orphan text? 
                        // If it's a property block at start of file? Ignore or console.warn
                    }
                }
            });

            // Post-process for properties
            const processNode = (node) => {
                const { props, rest } = parseProperties(node.rawLines);
                node.properties = props;
                // Append rest to content if any? Usually simple multiline content isn't handled this way in logseq 
                // (it's new blocks), but let's assume rawLines are just properties for now.
                // Text after properties in a block is usually not standard Logseq unless Soft Line Break.
                if (rest.length > 0) {
                    node.content += '\n' + rest.join('\n');
                }
                node.children.forEach(processNode);
            };
            roots.forEach(processNode);

            return roots;
        }

        const blocks = computed(() => parseOrg(sourceText.value));

        // --- Components ---

        const BlockProperties = ({ properties }) => {
            const entries = Object.entries(properties);
            if (entries.length === 0) return null;

            return html`
            <div class="block-properties">
                ${entries.map(([key, value]) => html`
                    <div class="block-properties-row">
                        <span class="block-properties-name">${key}:</span>
                        <span class="block-properties-value">${value}</span>
                    </div>
                `)}
            </div>
        `;
        };

        const formatContent = (text) => {
            // Simple formatter for [[Links]] and **Bold**
            // Returns an array of strings and vnodes
            if (!text) return null;

            const parts = [];
            let lastLastIndex = 0;

            // Regex for [[Link]] or **Bold**
            const regex = /(\[\[.*?\]\])|(\*\*.*?\*\*)/g;
            let match;

            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastLastIndex) {
                    parts.push(text.substring(lastLastIndex, match.index));
                }

                if (match[1]) { // Link
                    const linkText = match[1].slice(2, -2);
                    parts.push(html`<a class="page-ref" href="#">${linkText}</a>`);
                } else if (match[2]) { // Bold
                    const boldText = match[2].slice(2, -2);
                    parts.push(html`<strong>${boldText}</strong>`);
                }

                lastLastIndex = regex.lastIndex;
            }

            if (lastLastIndex < text.length) {
                parts.push(text.substring(lastLastIndex));
            }

            return parts;
        };

        const Block = ({ node }) => {
            const toggle = () => {
                if (node.children.length > 0) {
                    node.collapsed.value = !node.collapsed.value;
                }
            };

            return html`
            <div class="ls-block ${node.collapsed.value ? 'is-collapsed' : ''}" 
                 data-block-id="${node.id}"
                 data-refs="${JSON.stringify(Object.keys(node.properties))}">
                
                <div class="block-main-container">
                    <div class="block-control-wrap" onClick=${toggle}>
                        <div class="bullet"></div>
                    </div>
                    
                    <div class="block-content-wrapper">
                        <div class="block-content-inner">
                            ${formatContent(node.content)}
                        </div>
                        <${BlockProperties} properties=${node.properties} />
                    </div>
                </div>

                ${node.children.length > 0 && html`
                    <div class="block-children-container">
                        ${node.children.map(child => html`<${Block} node=${child} />`)}
                    </div>
                `}
            </div>
        `;
        };

        const ThemeSwitcher = () => html`
        <button class="theme-switcher" onClick=${toggleTheme}>
            ${theme.value === 'dark' ? '☀️ Light' : '🌙 Dark'}
        </button>
    `;

        const App = () => {
            return html`
            <${ThemeSwitcher} />
            <div class="page">
                <h1 style="margin-bottom: 2rem;">Logseq Simulation</h1>
                
                <div id="editor-toggle" onClick=${() => showEditor.value = !showEditor.value}>
                    ${showEditor.value ? 'Hide Source' : 'Edit Source'}
                </div>
                ${showEditor.value && html`
                    <textarea id="source-input" 
                              style="display:block" 
                              value=${sourceText} 
                              onInput=${e => sourceText.value = e.target.value}></textarea>
                `}
                
                <div style="margin-top: 20px;">
                    ${blocks.value.map(root => html`<${Block} node=${root} />`)}
                </div>
            </div>
        `;
        };

        render(html`<${App} />`, document.getElementById('app'));
    </script>

</body>

</html>
