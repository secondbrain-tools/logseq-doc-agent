<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logseq Simulation</title>
    <link rel="stylesheet" href="logseq-sim.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>
    <div id="app">Loading...</div>

    <!-- Sample Content -->


    <!-- App Logic -->
    <script type="module">
        import { mountApp } from "./logseq-sim-lib.js";
        import "./logseq-mock-api.js"; // Initialize API

        // Initialize the app with content from multiple files
        Promise.all([
            fetch("./default-content.txt").then(res => res.text()),
            fetch("./prompts.txt").then(res => res.text())
        ])
            .then(([defaultContent, promptsContent]) => {
                const combinedContent = defaultContent.trim() + "\n" + promptsContent.trim();
                mountApp("app", combinedContent);

                console.log("[Sim] App mounted, loading plugin...");
                // Load the plugin code dynamically AFTER app is mounted
                import("../dist/index.js")
                    .then(() =>
                        console.log("[Sim] Plugin script loaded successfully"),
                    )
                    .catch((e) =>
                        console.error("[Sim] Failed to load plugin script:", e),
                    );
            })
            .catch((e) => {
                console.error("[Sim] Failed to load content:", e);
                mountApp("app", "* Error loading content");
            });
    </script>
</body>

</html>
